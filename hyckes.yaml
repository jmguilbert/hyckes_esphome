external_components:
  - source:
      type: git
      url: https://github.com/jmguilbert/hyckes_esphome
      ref: master
    refresh: 0s
    components: [alpicool]
    
esp32_ble_tracker:
  scan_parameters:
    interval: 1000ms
    window: 500ms
    active: true

ble_client:
  - mac_address: ${fridge_mac}
    id: alpicool_ble

alpicool:
  id: alpicool_device
  ble_client_id: alpicool_ble
  update_interval: 2s

sensor:
  - platform: alpicool
    alpicool_id: alpicool_device
    current_temperature:
      name: "Température Frigo"
      id: alpicool_current_temp
    target_temperature:
      name: "Consigne Frigo (Interne)"
      id: alpicool_target_temp
      internal: true
    input_voltage:
      name: "Tension Batterie"
      id: alpicool_voltage
    right_current_temperature:
      name: "Température Congélateur"
      id: alpicool_right_current_temp
    right_target_temperature:
      name: "Consigne Congélateur (Interne)"
      id: alpicool_right_target_temp
      internal: true

binary_sensor:
  - platform: alpicool
    alpicool_id: alpicool_device
    connected:
      name: "Connecté"
      id: alpicool_connected
    running:
      name: "Compresseur"
      id: alpicool_running

switch:
  - platform: alpicool
    alpicool_id: alpicool_device
    power:
      name: "Alimentation"
      id: alpicool_power
    eco_mode:
      name: "Mode Eco"
      id: alpicool_eco

number:
  # Commandes brutes cachées (internal: true)
  - platform: alpicool
    alpicool_id: alpicool_device
    target_temperature:
      name: "Set Temp Internal"
      id: alpicool_set_temp
      internal: true
    right_target_temperature:
      name: "Set Right Temp Internal"
      id: alpicool_set_right_temp
      internal: true

  # Commandes de remplacement avec + / -
  - platform: template
    name: "Consigne Réfrigérateur"
    id: proxy_set_temp
    min_value: 2.0
    max_value: 10.0
    step: 1.0
    mode: box
    update_interval: 2s
    lambda: !lambda "return id(alpicool_set_temp).state;"
    set_action:
      - number.set:
          id: alpicool_set_temp
          value: !lambda "return x;"

  - platform: template
    name: "Consigne Congélateur"
    id: proxy_set_right_temp
    min_value: -18.0
    max_value: -12.0
    step: 1.0
    mode: box
    update_interval: 2s
    lambda: !lambda "return id(alpicool_set_right_temp).state;"
    set_action:
      - number.set:
          id: alpicool_set_right_temp
          value: !lambda "return x;"

select:
  # Protection Batterie
  - platform: template
    name: "Protection Batterie"
    id: proxy_battery_protection
    options:
      - "High"
      - "Medium"
      - "Low"
    update_interval: 2s
    lambda: |-
      uint8_t level = id(alpicool_device).get_battery_protection();
      if (level == 0) return {"High"};
      if (level == 1) return {"Medium"};
      if (level == 2) return {"Low"};
      return {};
    set_action:
      - lambda: |-
          uint8_t level = 0;
          if (x == "High") level = 0;
          else if (x == "Medium") level = 1;
          else if (x == "Low") level = 2;
          id(alpicool_device).send_battery_protection(level);

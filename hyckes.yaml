# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml
# JMG le 22 juillet 2026

esphome:
  name: hyckesv3
  friendly_name: HyckesV3

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
    
logger:
  level: DEBUG

api:
  encryption:
    key: xxxxx-votre-clef-api-xxxxxxxxxxx

ota:
  - platform: esphome

wifi:
  ssid: "votre SSID"
  password: "votre mot de passe"
  
substitutions:
  name: alpicool-fridge
  friendly_name: "Alpicool Fridge"
  fridge_mac: XX:XX:XX:XX:XX:XX 
  mqtt_topic: "alpicool"

captive_portal:

